<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probador de Modelo BRNN</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        #resultado { margin-top: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Analizador de Sentimiento con BRNN</h2>
    <p>Introduce una reseña de un cliente para analizar su contexto bidireccional:</p>
    
    <textarea id="textoInput" placeholder="Ej: El producto tardó mucho en llegar, pero la calidad es excepcional."></textarea>
    <br>
    <button onclick="analizarTexto()">Analizar Reseña</button>

    <div id="resultado">Esperando texto...</div>

    <script>
        async function analizarTexto() {
            const texto = document.getElementById('textoInput').value;
            const resultadoDiv = document.getElementById('resultado');
            
            resultadoDiv.innerHTML = "Analizando...";

            try {
                const response = await fetch('http://localhost:5000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: texto })
                });
                
                const data = await response.json();
                
                if(data.error) {
                    resultadoDiv.innerHTML = `<span style="color:red;">Error: ${data.error}</span>`;
                } else {
                    const color = data.sentimiento === "Positivo" ? "green" : "red";
                    resultadoDiv.innerHTML = `
                        <strong>Sentimiento:</strong> <span style="color:${color};">${data.sentimiento}</span><br>
                        <strong>Score (Confianza):</strong> ${(data.confianza * 100).toFixed(2)}%
                    `;
                }
            } catch (error) {
                resultadoDiv.innerHTML = `<span style="color:red;">Error de conexión con el servidor. ¿Está app.py ejecutándose?</span>`;
            }
        }
    </script>
</body>
</html>
